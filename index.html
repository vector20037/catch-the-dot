
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Dot Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #101827;
            color: white;
            padding: 20px;
        }

        #arena {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 350px;
            margin: 20px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
        }

        #dot {
            position: absolute;
            width: 42px;
            height: 42px;
            background: red;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
        }

        #start {
            padding: 12px 24px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <h1>🎯 Catch the Dot</h1>
    <p>Click the red dot as many times as possible in 20 seconds!</p>

    <h2>Score: <span id="score">0</span></h2>
    <h3>Time: <span id="time">20</span> seconds</h3>

    <button id="start">Start Game</button>

    <div id="arena">
        <button id="dot" aria-label="Catch the dot"></button>
    </div>

    <p id="message">Ready? Let's play!</p>

    <script>
        const arena = document.getElementById("arena");
        const dot = document.getElementById("dot");
        const scoreDisplay = document.getElementById("score");
        const timeDisplay = document.getElementById("time");
        const startButton = document.getElementById("start");
        const message = document.getElementById("message");

        let score = 0;
        let timeLeft = 20;
        let timer;
        let playing = false;

        function moveDot() {
            const maxX = arena.clientWidth - dot.offsetWidth;
            const maxY = arena.clientHeight - dot.offsetHeight;

            dot.style.left = Math.floor(Math.random() * (maxX + 1)) + "px";
            dot.style.top = Math.floor(Math.random() * (maxY + 1)) + "px";
        }

        startButton.addEventListener("click", function () {
            if (playing) return;

            score = 0;
            timeLeft = 20;
            playing = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            message.textContent = "Go! Catch the dot!";
            startButton.disabled = true;

            dot.style.display = "block";
            moveDot();

            timer = setInterval(function () {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    playing = false;
                    dot.style.display = "none";
                    startButton.disabled = false;
                    message.textContent = "Game over! Your score: " + score;
                }
            }, 1000);
        });

        dot.addEventListener("click", function () {
            if (!playing) return;

            score++;
            scoreDisplay.textContent = score;
            moveDot();
        });
    </script>
</body>
</html>
